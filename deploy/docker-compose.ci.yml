# Runs the production stack locally or in CI, built from source, on
# https://localhost (Caddy issues a certificate from its internal CA).
#
#   docker compose -f deploy/docker-compose.prod.yml -f deploy/docker-compose.ci.yml \
#     --env-file deploy/ci.env build
#   BACKUP_AGE_RECIPIENT=age1... docker compose ... up -d --wait
#
# Not for servers: ci.env holds throwaway credentials.

services:
  caddy:
    ports: !override
      - "${CI_HTTP_PORT:-18080}:80"
      - "${CI_HTTPS_PORT:-18443}:443"

  web:
    build:
      context: ../seopulse-frontend

  api:
    build:
      context: ../seopulse-backend

  backup:
    build:
      context: ./backup
    depends_on:
      s3: { condition: service_started }

  # Stand-in for S3 (Versity Gateway on a throwaway directory) so the backup
  # and restore scripts run end to end.
  s3:
    image: versity/versitygw:v1.8.0
    command: ["posix", "/data"]
    environment:
      ROOT_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID}
      ROOT_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY}
      VGW_PORT: ":9000"
      VGW_QUIET: "true"
    tmpfs:
      - /data
    networks: [backend]
