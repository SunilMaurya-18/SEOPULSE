# Production stack for a single VPS. See "Deployment" in the root README.md.
#
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --wait
#
# Only Caddy publishes ports. Postgres and Redis sit on an internal network
# with no route to the internet; the worker and backup reach the internet
# through the egress network.

name: seopulse

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-backend-env: &backend-env
  DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-seopulse}
  DB_USERNAME: ${DB_USERNAME:-seopulse}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://${APP_DOMAIN}}
  SEOPULSE_APP_BASE_URL: https://${APP_DOMAIN:?APP_DOMAIN is required}
  SEOPULSE_BOT_INFO_URL: ${SEOPULSE_BOT_INFO_URL:-https://${APP_DOMAIN}/bot}
  SEOPULSE_AUTH_REQUIRE_EMAIL_VERIFICATION: ${SEOPULSE_AUTH_REQUIRE_EMAIL_VERIFICATION:-false}
  SEOPULSE_AUTH_BREACHED_PASSWORD_CHECK: ${SEOPULSE_AUTH_BREACHED_PASSWORD_CHECK:-true}
  SEOPULSE_RATE_LIMIT_ENABLED: ${SEOPULSE_RATE_LIMIT_ENABLED:-true}
  # Email: Resend wins over SMTP; with neither set, emails are only logged.
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  EMAIL_FROM: ${EMAIL_FROM:-SEOPulse <noreply@seopulse.app>}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  STRIPE_PRICE_PRO_MONTHLY: ${STRIPE_PRICE_PRO_MONTHLY:-}
  STRIPE_PRICE_PRO_YEARLY: ${STRIPE_PRICE_PRO_YEARLY:-}
  STRIPE_PRICE_AGENCY_MONTHLY: ${STRIPE_PRICE_AGENCY_MONTHLY:-}
  STRIPE_PRICE_AGENCY_YEARLY: ${STRIPE_PRICE_AGENCY_YEARLY:-}
  STRIPE_SUCCESS_URL: https://${APP_DOMAIN}/settings?billing=success
  STRIPE_CANCEL_URL: https://${APP_DOMAIN}/pricing
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
  SENTRY_RELEASE: ${IMAGE_TAG:?IMAGE_TAG is required}
  SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.0}

services:

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      # Admin API (container-local only); fails while Caddy is crash-looping on a bad config.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      - web
      - api
    networks: [edge]
    logging: *logging
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 256M }

  web:
    image: ${IMAGE_REGISTRY:?IMAGE_REGISTRY is required}/seopulse-frontend:${IMAGE_TAG}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    networks: [edge]
    logging: *logging
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 64M }

  api:
    image: ${IMAGE_REGISTRY}/seopulse-backend:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      <<: *backend-env
      SPRING_PROFILES_ACTIVE: prod
      APP_NAME: seopulse-api
    healthcheck:
      # Readiness includes Postgres and Redis; Flyway migrations run before it goes green.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health/readiness > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 6
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    stop_grace_period: 45s
    networks: [edge, backend]
    logging: *logging
    deploy:
      resources:
        limits: { cpus: "1.50", memory: 1536M }

  worker:
    image: ${IMAGE_REGISTRY}/seopulse-backend:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      <<: *backend-env
      SPRING_PROFILES_ACTIVE: prod,worker
      APP_NAME: seopulse-worker
      # Only the API migrates; workers start after it is healthy.
      SPRING_FLYWAY_ENABLED: "false"
      SEOPULSE_WORKER_CONCURRENCY: ${SEOPULSE_WORKER_CONCURRENCY:-2}
    depends_on:
      api: { condition: service_healthy }
    stop_grace_period: 45s
    networks: [backend, egress]
    logging: *logging
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
      resources:
        limits: { cpus: "1.50", memory: 1536M }

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-seopulse}
      POSTGRES_USER: ${DB_USERNAME:-seopulse}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]
    logging: *logging
    deploy:
      resources:
        limits: { cpus: "1.00", memory: 2G }

  redis:
    image: redis:8
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    # noeviction: the audit queue lives in a stream and must never be evicted.
    command:
      - sh
      - -c
      - >-
        exec redis-server
        --appendonly yes
        --appendfsync everysec
        --maxmemory 512mb
        --maxmemory-policy noeviction
        --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]
    logging: *logging
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 768M }

  backup:
    image: ${IMAGE_REGISTRY}/seopulse-backup:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGDATABASE: ${DB_NAME:-seopulse}
      PGUSER: ${DB_USERNAME:-seopulse}
      PGPASSWORD: ${DB_PASSWORD}
      S3_BUCKET: ${BACKUP_S3_BUCKET:?BACKUP_S3_BUCKET is required}
      S3_PREFIX: ${BACKUP_S3_PREFIX:-seopulse}
      S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:?BACKUP_S3_ACCESS_KEY_ID is required}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:?BACKUP_S3_SECRET_ACCESS_KEY is required}
      AWS_DEFAULT_REGION: ${BACKUP_S3_REGION:-auto}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:?BACKUP_AGE_RECIPIENT is required}
      BACKUP_TIME: ${BACKUP_TIME:-02:30}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
      BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-6}
      BACKUP_HEARTBEAT_URL: ${BACKUP_HEARTBEAT_URL:-}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend, egress]
    logging: *logging
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 512M }

  # Optional: docker compose --profile monitoring up -d
  # Both UIs bind to 127.0.0.1 only; reach them through an SSH tunnel.
  prometheus:
    image: prom/prometheus:v3.7.3
    profiles: [monitoring]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks: [backend, monitoring]
    logging: *logging
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 512M }

  grafana:
    image: grafana/grafana:12.2.1
    profiles: [monitoring]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus]
    networks: [monitoring]
    logging: *logging
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 256M }

networks:
  edge: {}
  backend:
    internal: true
  egress: {}
  # Port publishing does not work on internal networks.
  monitoring: {}

volumes:
  caddy_data: {}
  caddy_config: {}
  postgres_data: {}
  redis_data: {}
  prometheus_data: {}
  grafana_data: {}
