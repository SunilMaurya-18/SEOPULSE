global:
  scrape_interval: 30s

scrape_configs:
  - job_name: seopulse-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api:8081"]

  # One A record per worker replica, so scaling needs no config change.
  - job_name: seopulse-worker
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 8081
