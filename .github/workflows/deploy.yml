name: Deploy

# main   -> CI, images, staging (automatic)
# v* tag -> CI, images, production (after approval on the "production" environment)
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  images:
    name: Build, scan and push ${{ matrix.image }}
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: seopulse-backend
            context: seopulse-backend
          - image: seopulse-frontend
            context: seopulse-frontend
          - image: seopulse-backup
            context: deploy/backup
    steps:
      - uses: actions/checkout@v7

      - name: Registry name
        id: registry
        # GHCR repository names must be lowercase.
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.registry.outputs.name }}/${{ matrix.image }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=main,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          # Only the frontend Dockerfile declares these; the others ignore them.
          build-args: |
            VITE_SENTRY_DSN=${{ vars.VITE_SENTRY_DSN }}
            VITE_RELEASE=${{ github.sha }}
            VITE_CONTACT_EMAIL=${{ vars.VITE_CONTACT_EMAIL }}
            VITE_TURNSTILE_SITE_KEY=${{ vars.VITE_TURNSTILE_SITE_KEY }}
            VITE_GOOGLE_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Scan for critical vulnerabilities
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            aquasec/trivy:0.70.0 image \
            --exit-code 1 --severity CRITICAL --ignore-unfixed --no-progress --timeout 15m \
            "${{ steps.registry.outputs.name }}/${{ matrix.image }}:${{ github.sha }}"

      - name: Push
        run: docker push --all-tags "${{ steps.registry.outputs.name }}/${{ matrix.image }}"

  staging:
    needs: images
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: staging
      image_tag: ${{ github.sha }}
    secrets: inherit

  production:
    needs: images
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: production
      image_tag: ${{ github.sha }}
    secrets: inherit
