name: Deploy environment

# Called by deploy.yml. Each GitHub environment (staging, production) holds:
#   secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS
#   vars:    APP_URL (https://...), optional DEPLOY_PATH and DEPLOY_SSH_PORT
# "production" should require a reviewer, which is the manual approval gate.
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image_tag:
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.APP_URL }}
    concurrency:
      group: deploy-env-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/seopulse' }}
      IMAGE_TAG: ${{ inputs.image_tag }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ vars.DEPLOY_SSH_PORT || '22' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host key: never trust on first use from CI.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host deploy-target
            HostName $HOST
            User $USER
            Port $PORT
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 15
          EOF

      - name: Upload deploy files
        # .env and the TLS/data volumes on the server are never touched.
        run: |
          # shellcheck disable=SC2029 # DEPLOY_PATH is meant to expand on the runner
          tar -czf - -C deploy docker-compose.prod.yml Caddyfile monitoring scripts/deploy.sh \
            | ssh deploy-target "mkdir -p '$DEPLOY_PATH' && tar -xzf - -C '$DEPLOY_PATH' && chmod +x '$DEPLOY_PATH/scripts/deploy.sh'"

      - name: Log in to GHCR on the server
        # The job token expires when this job ends, so no long-lived credential stays on the host.
        run: printf '%s' "${{ secrets.GITHUB_TOKEN }}" | ssh deploy-target docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Deploy (rolls back automatically if unhealthy)
        run: |
          # shellcheck disable=SC2029 # expanded on the runner, quoted for the remote shell
          ssh deploy-target "'$DEPLOY_PATH/scripts/deploy.sh' '$IMAGE_TAG'"

      - name: Log out of GHCR
        if: always()
        run: ssh deploy-target docker logout ghcr.io || true

      - name: Verify from the internet
        run: |
          curl -fsS --retry 10 --retry-delay 5 --retry-all-errors "$APP_URL/api/v1/health"
          curl -fsS -o /dev/null "$APP_URL/"
