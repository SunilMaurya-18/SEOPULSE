server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: seopulse-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    # Personal, git-ignored overrides (see application-local.yml.example)
    import: optional:classpath:application-local.yml

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/seopulse}
    username: ${DB_USERNAME:seopulse}
    password: ${DB_PASSWORD:seopulse_dev_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}

seopulse:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  crawler:
    max-pages: 500
    max-depth: 5
    connect-timeout-ms: 10000
    request-timeout-ms: 15000
    max-redirects: 5
    concurrency: 2
    max-body-size-bytes: 5000000
    bot-name: SEOPulseBot
    bot-info-url: ${SEOPULSE_BOT_INFO_URL:http://localhost:5173/bot}
    user-agent: "SEOPulseBot/1.0 (+${seopulse.crawler.bot-info-url})"
    respect-robots-txt: true
    robots-cache-ttl-hours: 24
    min-delay-ms: 250
    max-crawl-delay-ms: 30000
    max-retries: 2
    max-duration-minutes: 20
    allowed-ports: 80,443
  worker:
    pending-recovery-interval-minutes: 5
    pending-recovery-limit: 10
    outbox-publish-interval-ms: 2000
    outbox-batch-size: 50
