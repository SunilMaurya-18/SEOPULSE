server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: seopulse-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
    group:
      # Locally one process serves the API and runs the audit worker.
      # In production the worker runs in its own container (prod,worker).
      dev: worker
  config:
    # Personal, git-ignored overrides (see application-local.yml)
    import: optional:classpath:application-local.yml

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/seopulse}
    username: ${DB_USERNAME:seopulse}
    password: ${DB_PASSWORD:seopulse_dev_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  # SMTP delivery (e.g. Gmail with an app password). Unused when RESEND_API_KEY is set.
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 15000
      mail.smtp.writetimeout: 15000

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  mvc:
    async:
      # SSE streams manage their own timeout.
      request-timeout: -1

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis
  metrics:
    tags:
      application: ${spring.application.name}

sentry:
  # Empty DSN disables Sentry.
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:${spring.profiles.active}}
  release: ${SENTRY_RELEASE:}
  send-default-pii: false
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.0}

jwt:
  secret: ${JWT_SECRET}

seopulse:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  auth:
    access-token-ttl: ${SEOPULSE_AUTH_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${SEOPULSE_AUTH_REFRESH_TOKEN_TTL:30d}
    refresh-cookie-secure: ${SEOPULSE_AUTH_REFRESH_COOKIE_SECURE:true}
    # Off for now; set true to block audits until the email is verified.
    require-email-verification: ${SEOPULSE_AUTH_REQUIRE_EMAIL_VERIFICATION:false}
    app-base-url: ${SEOPULSE_APP_BASE_URL:http://localhost:5173}
    max-failed-logins: 10
    lockout-duration: 15m
    password-min-length: 10
    breached-password-check: ${SEOPULSE_AUTH_BREACHED_PASSWORD_CHECK:true}
  email:
    # Logs full email bodies (including single-use links). Never in prod.
    log-content: false
    resend-api-key: ${RESEND_API_KEY:}
    from: ${EMAIL_FROM:SEOPulse <noreply@seopulse.app>}
    dispatch-interval-ms: 5000
  billing:
    stripe-secret-key: ${STRIPE_SECRET_KEY:}
    stripe-webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    pro-monthly-price-id: ${STRIPE_PRICE_PRO_MONTHLY:}
    pro-yearly-price-id: ${STRIPE_PRICE_PRO_YEARLY:}
    agency-monthly-price-id: ${STRIPE_PRICE_AGENCY_MONTHLY:}
    agency-yearly-price-id: ${STRIPE_PRICE_AGENCY_YEARLY:}
    success-url: ${STRIPE_SUCCESS_URL:http://localhost:5173/settings?billing=success}
    cancel-url: ${STRIPE_CANCEL_URL:http://localhost:5173/pricing}
  rate-limit:
    enabled: ${SEOPULSE_RATE_LIMIT_ENABLED:true}
  reports:
    # Shared by the api and worker containers unless an S3 bucket is set.
    storage-dir: ${SEOPULSE_REPORTS_DIR:./data/reports}
    s3-bucket: ${SEOPULSE_REPORTS_S3_BUCKET:}
    s3-region: ${SEOPULSE_REPORTS_S3_REGION:us-east-1}
    s3-endpoint: ${SEOPULSE_REPORTS_S3_ENDPOINT:}
    s3-path-style: ${SEOPULSE_REPORTS_S3_PATH_STYLE:false}
    # Falls back to a key derived from JWT_SECRET.
    signing-key: ${SEOPULSE_REPORTS_SIGNING_KEY:}
    download-url-ttl: 10m
    default-share-days: 30
    max-share-days: 365
    poll-interval-ms: 5000
  alerts:
    dispatch-interval-ms: 10000
  retention:
    cron: "0 15 2 * * *"
  analysis:
    external-links:
      max-checks: 50
      max-per-host: 3
      concurrency: 4
      budget-seconds: 60
  crawler:
    max-pages: 500
    max-depth: 5
    connect-timeout-ms: 10000
    request-timeout-ms: 15000
    max-redirects: 5
    concurrency: 2
    max-body-size-bytes: 5000000
    bot-name: SEOPulseBot
    bot-info-url: ${SEOPULSE_BOT_INFO_URL:http://localhost:5173/bot}
    user-agent: "SEOPulseBot/1.0 (+${seopulse.crawler.bot-info-url})"
    respect-robots-txt: true
    robots-cache-ttl-hours: 24
    min-delay-ms: 250
    max-crawl-delay-ms: 30000
    max-retries: 2
    max-duration-minutes: 20
    allowed-ports: 80,443
  worker:
    concurrency: ${SEOPULSE_WORKER_CONCURRENCY:2}
    block-timeout-seconds: 5
    audit-timeout: 30m
    cancellation-poll-ms: 2000
    pending-recovery-idle: 35m
    pending-recovery-limit: 10
    outbox-publish-interval-ms: 2000
    outbox-batch-size: 50
    consumer-cleanup-idle-hours: 24
    stuck-audit-grace: 10m
