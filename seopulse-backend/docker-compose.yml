services:

  postgres:
    image: postgres:17
    container_name: seopulse-postgres
    environment:
      POSTGRES_DB: seopulse
      POSTGRES_USER: seopulse
      POSTGRES_PASSWORD: seopulse_dev_password
    ports:
      - "5432:5432"
    volumes:
      - seopulse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seopulse -d seopulse"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:8
    container_name: seopulse-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  seopulse_postgres_data:
